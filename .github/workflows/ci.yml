name: CI

# One workflow, two jobs, so a merge deploys without a second workflow hop.
# The site is plain HTML plus a dependency-free Worker: `test` needs no install
# at all, and `deploy` installs wrangler only. A pull request runs `test`; a
# push to main runs `test` then `deploy`.
on:
  pull_request:
    paths: ['**', '!**/*.md', '**/AGENTS.md']
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '**/AGENTS.md']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      # Wrangler uploads then activates a version; a cancelled deploy leaves
      # one uploaded and not activated.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
